# ClawGuard Trusted Ops Policy (example)
#
# This file is intentionally simple: key = value pairs, repeatable keys.
# It is meant to be readable by both OpenClaw wrappers and the ClawGuard daemon.
#
# Place a copy at:
#   ~/.clawguard/policy.ini
#
# Port allowlist (suppress "new port" alerts for known-good listeners)
# allow_port = 5432
# allow_port = 6379
#
# Process allowlist (best-effort; available on macOS via lsof, limited on Linux without root)
# allow_process = postgres
# allow_process = ControlCe
#
# Skill allowlist (for OpenClaw-side enforcement or triage heuristics)
# allow_skill = trusted-skill-name
#
# Command allowlist for wrappers (prefix or regex)
# allow_cmd_prefix = /usr/bin/git
# allow_cmd_prefix = /usr/bin/curl
# allow_cmd_regex = ^curl https://clawguard\\.net

